<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKIN BRIDGE Threads OAuth Callback</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;max-width:720px;margin:60px auto;padding:0 20px;line-height:1.6;color:#222}
.card{padding:28px;border:1px solid #e5e5e5;border-radius:16px}
code{display:block;word-break:break-all;padding:14px;background:#f6f6f6;border-radius:10px}
.warn{color:#8a3b12}
</style>
</head>
<body>
<div class="card">
<h1>Threads authorization complete</h1>
<p id="status">승인 결과를 확인하는 중입니다.</p>
<div id="codewrap" hidden>
<p>아래 authorization code를 토큰 교환 단계에서 사용하세요.</p>
<code id="code"></code>
<p class="warn">이 코드는 짧은 시간 동안만 유효하며 다른 사람에게 공유하지 마세요.</p>
</div>
</div>
<script>
const p=new URLSearchParams(location.search);
const code=p.get("code");
const err=p.get("error")||p.get("error_message")||p.get("error_description");
if(code){
  document.getElementById("status").textContent="Threads 권한 승인이 완료되었습니다.";
  document.getElementById("code").textContent=code;
  document.getElementById("codewrap").hidden=false;
}else if(err){
  document.getElementById("status").textContent="승인 오류: "+err;
}else{
  document.getElementById("status").textContent="승인 코드가 없습니다.";
}
</script>
</body>
</html>
